<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>everyday-tools</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 { margin-bottom: 0.25rem; }
      .sub { margin-top: 0; color: gray; }
      ul { list-style: none; padding: 0; }
      li a {
        display: block;
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 0.5rem;
        text-decoration: none;
        color: inherit;
      }
      li a:hover { border-color: currentColor; }
      li + li { margin-top: 0.75rem; }
      .desc { margin: 0.25rem 0 0; color: gray; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>everyday-tools</h1>
      <p class="sub">Kumpulan tools kecil. Semua web tool diproses 100% di browser.</p>

      <ul>
        <li>
          <a href="./compress-images/">
            <strong>Compress Images</strong>
            <p class="desc">Kompresor gambar — gambar tidak pernah dikirim ke server.</p>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
